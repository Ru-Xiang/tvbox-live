plugins {
    id 'com.android.application'
}

android {
    compileSdkVersion rootProject.ext.compileSdkVersion
    // 显式指定构建工具版本，与构建镜像内已安装的版本对齐，避免联网拉取缺失版本
    buildToolsVersion "33.0.2"
    namespace 'com.github.tvbox.osc'

    defaultConfig {
        applicationId "com.github.tvbox.osc.live"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName

        multiDexEnabled true

        // ABI 过滤：支持通过 -PtargetAbi 指定，便于生成 arm32 / arm64 独立包
        //   ./gradlew assembleRelease -PtargetAbi=armeabi-v7a  → 仅 arm32
        //   ./gradlew assembleRelease -PtargetAbi=arm64-v8a    → 仅 arm64
        //   不传或传 all → 全 ABI（默认，兼容性最好）
        def targetAbi = project.hasProperty('targetAbi') ? project.property('targetAbi').toString() : 'all'
        ndk {
            if (targetAbi == 'all') {
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            } else {
                // 支持逗号分隔，如 -PtargetAbi=armeabi-v7a,arm64-v8a
                targetAbi.split(',').each { abi ->
                    abiFilters abi.trim()
                }
            }
        }
    }

    signingConfigs {
        release {
            // keystore 与密码可通过环境变量覆盖，未设置时使用项目内置默认值
            def ksFile = System.getenv('TVBOX_KEYSTORE') ?: "${rootProject.projectDir}/tvboxlive.keystore"
            storeFile file(ksFile)
            storePassword System.getenv('TVBOX_KEYSTORE_PASSWORD') ?: 'tvboxlive123'
            keyAlias System.getenv('TVBOX_KEY_ALIAS') ?: 'tvboxlive'
            keyPassword System.getenv('TVBOX_KEY_PASSWORD') ?: 'tvboxlive123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 仅在 keystore 存在时启用签名，避免他人克隆无 keystore 时构建失败
            if (signingConfigs.release.storeFile != null && signingConfigs.release.storeFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        abortOnError false
        checkReleaseBuilds false
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
    }
}

dependencies {
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
    implementation 'androidx.leanback:leanback:1.0.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.preference:preference:1.2.1'

    // Lifecycle
    implementation "androidx.lifecycle:lifecycle-viewmodel:${rootProject.ext.lifecycleVersion}"
    implementation "androidx.lifecycle:lifecycle-livedata:${rootProject.ext.lifecycleVersion}"
    implementation "androidx.lifecycle:lifecycle-runtime:${rootProject.ext.lifecycleVersion}"
    implementation "androidx.lifecycle:lifecycle-service:${rootProject.ext.lifecycleVersion}"

    // Room 数据库
    implementation "androidx.room:room-runtime:${rootProject.ext.roomVersion}"
    annotationProcessor "androidx.room:room-compiler:${rootProject.ext.roomVersion}"

    // 网络
    implementation "com.squareup.okhttp3:okhttp:${rootProject.ext.okhttpVersion}"
    implementation "com.squareup.okhttp3:logging-interceptor:${rootProject.ext.okhttpVersion}"

    // JSON
    implementation "com.google.code.gson:gson:${rootProject.ext.gsonVersion}"

    // 播放器 - ExoPlayer
    implementation "com.google.android.exoplayer:exoplayer-core:${rootProject.ext.exoplayerVersion}"
    implementation "com.google.android.exoplayer:exoplayer-hls:${rootProject.ext.exoplayerVersion}"
    implementation "com.google.android.exoplayer:exoplayer-dash:${rootProject.ext.exoplayerVersion}"
    implementation "com.google.android.exoplayer:exoplayer-ui:${rootProject.ext.exoplayerVersion}"
    // RTSP 支持：DefaultMediaSourceFactory 检测到 rtsp:// 时会自动使用该模块
    implementation "com.google.android.exoplayer:exoplayer-rtsp:${rootProject.ext.exoplayerVersion}"
    // RTMP 支持：提供 RtmpDataSource（含 native 库），需在数据源工厂中按协议分发
    implementation "com.google.android.exoplayer:extension-rtmp:${rootProject.ext.exoplayerVersion}"

    // 图片加载
    implementation "com.github.bumptech.glide:glide:${rootProject.ext.glideVersion}"
    annotationProcessor "com.github.bumptech.glide:compiler:${rootProject.ext.glideVersion}"

    // 事件总线
    implementation 'org.greenrobot:eventbus:3.3.1'

    // 内置 HTTP 服务器（扫码配置网页）
    implementation 'org.nanohttpd:nanohttpd:2.3.1'

    // 二维码生成
    implementation 'com.google.zxing:core:3.5.2'

    // Hawk 配置存储
    implementation 'com.orhanobut:hawk:2.0.1'

    // 日志
    implementation 'com.jakewharton.timber:timber:5.0.1'

    // WorkManager 后台任务
    implementation 'androidx.work:work-runtime:2.8.1'
}
